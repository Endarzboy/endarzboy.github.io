# ──────────────────────────────────────────────────────────────
#  Site settings — edit these values, then commit.
#  (Changes to this file need a restart of `jekyll serve` locally.)
# ──────────────────────────────────────────────────────────────
title: Maregu Assefa
description: >-
  Postdoctoral Fellow at Khalifa University working on self-supervised and
  semi-supervised representation learning for medical imaging and video.
url: "https://endarzboy.github.io"
baseurl: ""
lang: en
timezone: Asia/Dubai

# ── Profile shown in the left panel ───────────────────────────
author:
  name: Maregu Assefa
  pronouns: ""                     # e.g. "he/him" (leave empty to hide)
  avatar: /assets/img/profile.jpg  # square photo, at least 400 px
  title: Postdoctoral Fellow
  affiliation: Khalifa University
  affiliation_url: https://www.ku.ac.ae/
  location: Abu Dhabi, UAE
  email: maregu.habtie@ku.ac.ae

# ── Profile links (any left empty are hidden automatically) ───
links:
  scholar: https://scholar.google.com/citations?user=XR6wzDQAAAAJ
  orcid: https://orcid.org/0000-0003-2815-7993
  github: https://github.com/Endarzboy
  linkedin: https://www.linkedin.com/in/maregu-assefa-mara
  researchgate: ""                 # TODO: https://www.researchgate.net/profile/...
  twitter: ""                      # TODO: https://x.com/...
  semanticscholar: ""              # optional
  dblp: ""                         # optional

github_username: Endarzboy         # used by the Projects page
github_exclude: []                # repo names to hide from "All repositories", e.g. [e-Student-System]

# Your name as it appears in author lists — these get bolded.
self_names:
  - Maregu Assefa
  - Maregu Assefa Habtie
  - M. Assefa

# CV PDF (put the file in assets/cv/ and set the path; empty = hide button)
cv_pdf: ""                         # e.g. /assets/cv/Maregu_Assefa_CV.pdf

# Main navigation
nav:
  - { title: About,         url: / }
  - { title: Publications,  url: /publications/ }
  - { title: News & Events, url: /news/ }
  - { title: Projects,      url: /projects/ }
  - { title: CV,            url: /cv/ }

# How many items to show on the home page
home:
  news_count: 6
  show_selected_publications: true

# ── Collections: one Markdown file per news item / event ──────
collections:
  news:
    output: false

defaults:
  - scope: { path: "" }
    values: { layout: page }

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
  - .github/
  - _papers/
  - assets/img/my_photos/
  - my_CV_latex/
  - "Claude outputs/"
