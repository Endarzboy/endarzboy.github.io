# ──────────────────────────────────────────────────────────────
#  PUBLICATIONS — one entry per paper. Keep the list NEWEST FIRST:
#  the site shows them in exactly this order.
#
#  Quickest way to add a paper:
#     python3 tools/bib2yml.py --prepend     # paste a BibTeX entry, then Ctrl-D
#
#  Fields (title, authors, venue, year, type are required):
#    id           short unique key (also the thumbnail file name)
#    title, authors (list), venue (full name), year
#    venue_short  text on the thumbnail badge, e.g. "CVPR"
#    type         conference | journal | preprint | workshop
#    note         optional highlight, e.g. "Oral", "Datasets & Benchmarks Track"
#    selected     true → also shown on the home page
#    thumbnail    image in assets/img/papers/ (first figure or architecture figure)
#    links        pdf, arxiv, code, project   (doi is kept for reference, not shown)
#    bibtex       BibTeX entry (shown with a copy button)
# ──────────────────────────────────────────────────────────────

